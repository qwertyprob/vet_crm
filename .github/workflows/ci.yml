name: CI / CD
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: docker compose -f ./ci-cd/test/docker-compose.yml build
  
  test:
    needs: build
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4
      - name: Run RSpec
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: docker compose -f ./ci-cd/test/docker-compose.yml up --exit-code-from test-runner --abort-on-container-exit
      - name: Cleanup
        if: always()
        run: docker compose -f ./ci-cd/test/docker-compose.yml down -v
  
  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest 
    environment: env
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose -f ./ci-cd/dev/docker-compose.yml build
      - name: Deploy
        env:
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          docker compose -f ./ci-cd/dev/docker-compose.yml down
          docker compose -f ./ci-cd/dev/docker-compose.yml up -d
      - name: Cleanup images
        run: docker image prune -f
  
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: env
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose -f ./ci-cd/prod/docker-compose.yml build
      - name: Deploy
        env:
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          docker compose -f ./ci-cd/prod/docker-compose.yml down
          docker compose -f ./ci-cd/prod/docker-compose.yml up -d
      - name: Cleanup images
        run: docker image prune -f

  open-release-pr:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR dev -> main if dev is ahead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "dev has nothing new for main, skipping"
            exit 0
          fi
          body="$(git log --format='- %s' origin/main..HEAD)"
          existing="$(gh pr list --base main --head dev --state open --json number -q '.[0].number')"
          if [ -n "${existing}" ]; then
            number="${existing}"
            gh pr edit "${number}" --body "${body}"
          else
            url="$(gh pr create --base main --head dev --title "Release" --body "${body}")"
            number="${url##*/}"
          fi
          # Title matches GitHub's default merge message, with the real PR number.
          gh pr edit "${number}" --title "Merge pull request #${number} from ${GITHUB_REPOSITORY_OWNER}/dev"

  release:
    needs: deploy-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: env
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          last="${last:-v0.0.0}"
          version="${last#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          # Label on the merged PR decides the bump; patch is the default.
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" -q '.[0].labels[].name' 2>/dev/null | tr '\n' ' ' || true)"
          case " ${labels}" in
            *" major "*) major=$((major + 1)); minor=0; patch=0 ;;
            *" minor "*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac

          tag="v${major}.${minor}.${patch}"

          # Release notes come only from CHANGELOG.md. No section means no release.
          awk -v v="${tag#v}" 'index($0, "## [" v "]") == 1 {found=1; next} /^## /{found=0} found' CHANGELOG.md \
            | sed '/./,$!d' > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::notice::No CHANGELOG.md section for ${tag}, release skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Send Telegram release notification
        if: steps.version.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          CI_COMMIT_TAG: ${{ steps.version.outputs.tag }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PROJECT_PATH: ${{ github.repository }}
        run: sh ./ci-cd/prod/telegram_release_notify.sh
